<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guess the Element</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="app">
    <h1>Guess the Element</h1>
    <p class="subtitle">Count the electron shells and electrons, then name the element.</p>

    <nav class="tabs" aria-label="App sections">
      <button class="tab active" type="button" role="tab" aria-selected="true" aria-controls="gamePanel"
        id="gameTab">Game</button>
      <button class="tab" type="button" role="tab" aria-selected="false" aria-controls="settingsPanel"
        id="settingsTab">Settings</button>
    </nav>

    <main id="gamePanel" class="tab-panel" role="tabpanel" aria-labelledby="gameTab">
      <canvas id="atomCanvas" width="480" height="480"></canvas>

      <form id="guessForm" autocomplete="off">
        <input id="guessInput" type="text" placeholder="Type element name or symbol..." autofocus>
        <button type="submit">Guess</button>
        <button type="button" id="skipBtn">Skip</button>
        <button type="button" id="revealBtn">Reveal</button>
      </form>

      <p id="feedback" class="feedback"></p>
      <p id="score" class="score">Score: 0 / 0</p>
    </main>

    <section id="settingsPanel" class="tab-panel settings-panel" role="tabpanel" aria-labelledby="settingsTab" hidden>
      <h2>Game settings</h2>
      <label for="rowCount">Periodic table rows</label>
      <select id="rowCount">
        <option value="1">1 row (Hydrogen-Helium)</option>
        <option value="2">2 rows (Hydrogen-Neon)</option>
        <option value="3">3 rows (Hydrogen-Argon)</option>
        <option value="4">4 rows (Hydrogen-Krypton)</option>
        <option value="5">5 rows (Hydrogen-Xenon)</option>
      </select>
      <p>Only elements from the selected rows will appear in the game.</p>
    </section>
  </div>

  <script src="script.js"></script>
</body>

</html>
